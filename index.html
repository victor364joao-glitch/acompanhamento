<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563EB">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563EB'/%3E%3Cpath d='M50 28 L78 40 L50 52 L22 40 Z' fill='%23FFFFFF'/%3E%3Cpath d='M32 46 V64 Q50 74 68 64 V46' fill='none' stroke='%23FFFFFF' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='78' cy='40' r='4' fill='%23FFFFFF'/%3E%3Cline x1='78' y1='40' x2='78' y2='58' stroke='%23FFFFFF' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Acompanhamento</title>
<style>
/* ===== Reset e variáveis ===== */
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --azul: #2563EB;
  --verde: #16A34A;
  --rosa: #EC4899;
  --acento: #F97316;
  --destaque: #FBBF24;
  --fundo: #FFFFFF;
  --superficie: #FFFFFF;
  --texto: #1F2937;
  --texto-sec: #6B7280;
  --borda: #E5E7EB;
  --sucesso-fundo: #DCFCE7;
  --sucesso-texto: #166534;
  --neutro-fundo: #F3F4F6;
  --ceu: #EFF6FF;
  --terra: #D9F99D;
  --sobre-cor: #FFFFFF;
  --cor-aba: var(--azul);
}

/* ===== Tema escuro ===== */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --azul: #60A5FA;
    --verde: #4ADE80;
    --rosa: #F472B6;
    --acento: #FB923C;
    --destaque: #FCD34D;
    --fundo: #0F172A;
    --superficie: #1E293B;
    --texto: #F1F5F9;
    --texto-sec: #94A3B8;
    --borda: #334155;
    --sucesso-fundo: #14532D;
    --sucesso-texto: #BBF7D0;
    --neutro-fundo: #334155;
    --ceu: #172554;
    --terra: #365314;
  }
}
:root[data-tema="escuro"] {
  --azul: #60A5FA;
  --verde: #4ADE80;
  --rosa: #F472B6;
  --acento: #FB923C;
  --destaque: #FCD34D;
  --fundo: #0F172A;
  --superficie: #1E293B;
  --texto: #F1F5F9;
  --texto-sec: #94A3B8;
  --borda: #334155;
  --sucesso-fundo: #14532D;
  --sucesso-texto: #BBF7D0;
  --neutro-fundo: #334155;
  --ceu: #172554;
  --terra: #365314;
  --sobre-cor: #0F172A;
}
html, body {
  background: var(--fundo);
  color: var(--texto);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3 { font-weight: 600; }

/* ===== Header ===== */
header.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--superficie);
  border-bottom: 1px solid var(--borda);
}
header.app-header svg.logo { width: 30px; height: 30px; flex-shrink: 0; }
.header-titulo { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; min-width: 0; }
.header-titulo span.fixo { font-size: 18px; font-weight: 600; white-space: nowrap; }
#nomeCrianca {
  border: none;
  border-bottom: 1px dashed var(--borda);
  font-size: 18px;
  font-weight: 600;
  color: var(--texto);
  background: transparent;
  min-width: 60px;
  max-width: 45vw;
  padding: 2px 0;
}
#nomeCrianca:focus { outline: none; border-bottom-color: var(--azul); }
#btnTema {
  margin-left: auto;
  width: 44px; height: 44px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--borda);
  border-radius: 10px;
  background: var(--superficie);
  color: var(--texto-sec);
}
#btnTema svg { width: 22px; height: 22px; }

/* ===== Navegação de abas ===== */
nav.tabs {
  position: sticky;
  top: 55px;
  z-index: 19;
  display: flex;
  background: var(--superficie);
  border-bottom: 1px solid var(--borda);
}
nav.tabs button {
  flex: 1;
  min-height: 48px;
  border: none;
  background: transparent;
  color: var(--texto-sec);
  font-size: 14px;
  font-weight: 500;
  border-bottom: 3px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}
nav.tabs button.ativa { color: var(--cor-tab); border-bottom-color: var(--cor-tab); }
nav.tabs button[data-tab="1"] { --cor-tab: var(--azul); }
nav.tabs button[data-tab="2"] { --cor-tab: var(--verde); }
nav.tabs button[data-tab="3"] { --cor-tab: var(--rosa); }

/* ===== Conteúdo das abas ===== */
main { padding: 16px; padding-bottom: 32px; max-width: 900px; margin: 0 auto; }
.painel-tab { display: none; opacity: 0; transition: opacity 0.2s; }
.painel-tab.ativo { display: block; opacity: 1; }

.card {
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.card h2 { font-size: 20px; margin-bottom: 4px; }
.rotulo { font-size: 13px; font-weight: 500; color: var(--texto-sec); }

/* ===== Seletor de data ===== */
.seletor-data { display: flex; align-items: center; gap: 8px; }
.seletor-data button {
  min-width: 44px; min-height: 44px;
  border: 1px solid var(--borda);
  background: var(--superficie);
  border-radius: 10px;
  font-size: 18px;
  color: var(--azul);
}
.seletor-data input[type="date"] {
  flex: 1;
  min-height: 44px;
  border: 1px solid var(--borda);
  background: var(--superficie);
  color: var(--texto);
  border-radius: 10px;
  padding: 0 10px;
}
:root[data-tema="escuro"] input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
}

/* ===== Itens do checklist ===== */
.item-check {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 4px;
  min-height: 44px;
  border-bottom: 1px solid var(--borda);
  cursor: pointer;
}
.item-check:last-child { border-bottom: none; }
.item-check input[type="checkbox"] {
  width: 26px; height: 26px;
  flex-shrink: 0;
  accent-color: var(--azul);
  margin-top: 2px;
}
.item-check .texto-item strong { display: block; font-size: 15px; font-weight: 600; }
.item-check .texto-item small { color: var(--texto-sec); font-size: 13px; }

textarea#observacaoDia {
  width: 100%;
  border: 1px solid var(--borda);
  background: var(--superficie);
  color: var(--texto);
  border-radius: 10px;
  padding: 10px;
  resize: vertical;
  min-height: 56px;
  margin-top: 8px;
}
.feedback-salvo {
  font-size: 13px;
  color: var(--verde);
  font-weight: 500;
  height: 18px;
  margin-top: 6px;
  opacity: 0;
  transition: opacity 0.3s;
}
.feedback-salvo.mostrar { opacity: 1; }

/* ===== Painel da criança ===== */
.card-crianca {
  background: linear-gradient(180deg, var(--ceu) 0%, var(--superficie) 70%);
  border: 1px solid var(--borda);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  overflow: hidden;
}
.topo-crianca { display: flex; align-items: center; gap: 12px; }
.mascote { width: 62px; height: 62px; flex-shrink: 0; }
.mascote svg { width: 100%; height: 100%; display: block; }
.card-brincadeira:focus-visible, .card-atividade:focus-visible,
nav.tabs button:focus-visible, .chip:focus-visible {
  outline: 3px solid var(--acento);
  outline-offset: 2px;
}
.mascote-fala { font-size: 15px; font-weight: 600; }
.mascote-sub { font-size: 13px; color: var(--texto-sec); }

.jardim {
  position: relative;
  margin-top: 14px;
  height: 118px;
  border-radius: 10px;
  background: var(--ceu);
  overflow: hidden;
}
.jardim-chao { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: var(--terra); }
.jardim-plantas {
  position: absolute;
  left: 0; right: 0; bottom: 18px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;
  padding: 0 8px;
  flex-wrap: wrap-reverse;
}
.jardim-plantas svg { width: 26px; height: 34px; animation: brotar .45s ease-out backwards; }
.jardim-vazio {
  position: absolute;
  left: 0; right: 0; top: 34px;
  text-align: center;
  font-size: 13px;
  color: var(--texto-sec);
}
@keyframes brotar {
  from { transform: translateY(10px) scale(.4); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}

.adesivos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.adesivo {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--sucesso-fundo);
}
.adesivo svg { width: 26px; height: 26px; }
.adesivos-vazio { font-size: 13px; color: var(--texto-sec); margin-top: 12px; }

/* ===== Celebração ===== */
.celebracao {
  position: fixed;
  inset: 0;
  z-index: 60;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.celebracao-texto {
  background: var(--sucesso-fundo);
  color: var(--sucesso-texto);
  font-size: 18px;
  font-weight: 600;
  padding: 14px 24px;
  border-radius: 14px;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  animation: pulsar 1.6s ease-out forwards;
}
.faisca { position: absolute; width: 18px; height: 18px; animation: subir 1.5s ease-out forwards; }
@keyframes pulsar {
  0%   { transform: scale(.7); opacity: 0; }
  18%  { transform: scale(1); opacity: 1; }
  75%  { opacity: 1; }
  100% { transform: scale(1); opacity: 0; }
}
@keyframes subir {
  0%   { transform: translateY(0) scale(.5) rotate(0deg); opacity: 1; }
  100% { transform: translateY(-140px) scale(1.1) rotate(160deg); opacity: 0; }
}
@keyframes pipoco {
  50% { transform: scale(1.35); }
}
.item-check input[type="checkbox"]:checked { animation: pipoco .3s ease-out; }

@media (prefers-reduced-motion: reduce) {
  .jardim-plantas svg, .celebracao-texto, .faisca,
  .item-check input[type="checkbox"]:checked { animation: none; }
  .faisca { display: none; }
  .painel-tab { transition: none; }
}

/* ===== Painel semanal ===== */
.linha-item-semana { margin-bottom: 12px; }
.linha-item-semana .topo-linha {
  display: flex; justify-content: space-between;
  font-size: 13px; font-weight: 500; margin-bottom: 4px;
}
.barra-fundo {
  background: var(--borda);
  border-radius: 8px;
  height: 10px;
  overflow: hidden;
}
.barra-progresso {
  height: 100%;
  background: var(--azul);
  border-radius: 8px;
  transition: width 0.3s;
}
.faixa-status {
  margin-top: 12px;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  text-align: center;
}
.faixa-status.boa { background: var(--sucesso-fundo); color: var(--sucesso-texto); }
.faixa-status.andamento { background: var(--neutro-fundo); color: var(--texto-sec); }

/* ===== Histórico ===== */
.linha-historico {
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px;
  padding: 10px 4px;
  border-bottom: 1px solid var(--borda);
  font-size: 13px;
}
.linha-historico:last-child { border-bottom: none; }
.linha-historico .intervalo { color: var(--texto); font-weight: 500; }
.linha-historico .total { color: var(--texto-sec); }
.tag-status {
  font-size: 12px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 8px;
  white-space: nowrap;
}
.tag-status.boa { background: var(--sucesso-fundo); color: var(--sucesso-texto); }
.tag-status.andamento { background: var(--neutro-fundo); color: var(--texto-sec); }

/* ===== Brincadeiras ===== */
.chips-categoria {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
}
.chip {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid var(--borda);
  background: var(--superficie);
  font-size: 13px;
  font-weight: 500;
  color: var(--texto-sec);
  white-space: nowrap;
}
.chip.ativo { color: #fff; border-color: transparent; }

.grid-brincadeiras {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  margin-top: 16px;
}
@media (min-width: 600px) { .grid-brincadeiras { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 900px) { .grid-brincadeiras { grid-template-columns: repeat(3, 1fr); } }

.card-brincadeira {
  position: relative;
  border: 1px solid var(--borda);
  border-radius: 14px;
  overflow: hidden;
  background: var(--superficie);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  cursor: pointer;
}
.card-brincadeira .tarja { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }
.card-brincadeira .conteudo { padding: 14px 44px 14px 20px; }
.card-brincadeira .cabecalho { display: flex; align-items: flex-start; gap: 10px; }
.card-brincadeira svg.icone-cat { width: 28px; height: 28px; flex-shrink: 0; }
.card-brincadeira h3 { font-size: 16px; margin-bottom: 2px; }
.card-brincadeira .duracao { font-size: 13px; color: var(--texto-sec); }
.btn-favorito {
  position: absolute;
  top: 6px; right: 6px;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: none;
}
.detalhe-brincadeira { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--borda); font-size: 14px; }
.detalhe-brincadeira.aberto { display: block; }
.detalhe-brincadeira h4 { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--texto-sec); }
.detalhe-brincadeira ol { padding-left: 18px; margin-bottom: 4px; }
.detalhe-brincadeira li { margin-bottom: 4px; }

/* ===== Placeholder e estado vazio ===== */
.placeholder-aba {
  text-align: center;
  color: var(--texto-sec);
  padding: 48px 16px;
}
.estado-vazio {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--texto-sec);
  padding: 32px 16px;
}
.estado-vazio svg { width: 64px; height: 64px; margin-bottom: 10px; }
.estado-vazio strong { display: block; color: var(--texto); font-size: 15px; margin-bottom: 4px; }
.estado-vazio span { font-size: 13px; }

/* ===== Atividades: grid de cards ===== */
.grid-atividades {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  margin-top: 16px;
}
@media (min-width: 600px) { .grid-atividades { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 900px) { .grid-atividades { grid-template-columns: repeat(3, 1fr); } }

.card-atividade {
  position: relative;
  border: 1px solid var(--borda);
  border-radius: 14px;
  background: var(--superficie);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  padding: 16px 44px 16px 16px;
  cursor: pointer;
}
.card-atividade svg.icone-cat { width: 28px; height: 28px; color: var(--verde); flex-shrink: 0; }
.card-atividade .cabecalho { display: flex; align-items: center; gap: 10px; }
.card-atividade h3 { font-size: 16px; }
.card-atividade .dificuldade { font-size: 13px; color: var(--texto-sec); margin-top: 4px; }
.card-atividade .btn-favorito { position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; }

/* ===== Atividades: controles e folha ===== */
.controles-folha {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 16px;
}
.controles-folha select, .controles-folha button {
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid var(--borda);
  border-radius: 10px;
  background: var(--superficie);
  color: var(--texto);
  font-size: 14px;
}
.controles-folha button { background: var(--verde); color: var(--sobre-cor); border-color: var(--verde); font-weight: 500; }
.acoes-folha { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.acoes-folha button {
  min-height: 44px;
  padding: 0 18px;
  border-radius: 10px;
  border: 1px solid var(--borda);
  font-size: 14px;
  font-weight: 500;
}
#btnImprimir { background: var(--verde); color: var(--sobre-cor); border-color: var(--verde); }
#btnVoltarAtividade { background: var(--superficie); color: var(--texto-sec); }

.folha-a4 {
  background: #fff;
  border: 1px solid var(--borda);
  border-radius: 8px;
  padding: 14mm 12mm;
  max-width: 620px;
  margin: 0 auto;
  color: #000;
}
.folha-cabecalho { font-size: 14pt; font-weight: 600; border-bottom: 2px solid #000; padding-bottom: 8px; }
.folha-corpo { min-height: 320px; padding: 16px 0; }
.folha-rodape { margin-top: 24px; padding-top: 8px; border-top: 1px dashed #000; font-size: 12pt; }

/* ===== Atividade: colorir ===== */
.area-colorir { display: flex; justify-content: center; align-items: center; padding: 20px 0; }
.area-colorir svg { width: 260px; height: 260px; --sw-contorno: 3; --sw-detalhe: 2; }

/* ===== Atividade: sombras ===== */
.colunas-sombra { display: flex; justify-content: space-between; gap: 24px; }
.coluna-sombra { display: flex; flex-direction: column; gap: 28px; flex: 1; }
.item-sombra { display: flex; align-items: center; gap: 12px; }
.figura-sombra { width: 70px; height: 70px; flex-shrink: 0; }
.figura-sombra svg { --sw-contorno: 4.5; --sw-detalhe: 3.5; }
.letra-sombra {
  font-size: 18px; font-weight: 700;
  width: 30px; height: 30px;
  border: 2px solid #000; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ===== Atividade: memória ===== */
.grade-memoria { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.carta-memoria { border: 2px dashed #000; padding: 6px; aspect-ratio: 1; }
.carta-memoria svg { width: 100%; height: 100%; --sw-contorno: 4; --sw-detalhe: 3; }

/* ===== Atividade: contar e colorir ===== */
.lista-contar { display: flex; flex-direction: column; }
.linha-contar { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #000; padding: 10px 0; }
.repeticoes-contar { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.figura-contar { width: 46px; height: 46px; }
.figura-contar svg { --sw-contorno: 7; --sw-detalhe: 5; }
.caixa-numero { width: 40px; height: 40px; border: 2px solid #000; border-radius: 6px; flex-shrink: 0; }

/* ===== Atividade: labirinto ===== */
.area-labirinto { display: flex; justify-content: center; }
.area-labirinto svg { width: 100%; max-width: 420px; }

/* ===== Atividade: traçar letras/números ===== */
.grade-traco { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.linha-pautada {
  position: relative;
  height: 90px;
  border-top: 1px solid #000;
  border-bottom: 1px solid #000;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.linha-pautada::before {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 50%;
  border-top: 1px dashed #999;
}
.letra-grande {
  font-size: 60px;
  font-weight: 700;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  position: relative;
  z-index: 1;
}
.letra-contorno { -webkit-text-stroke: 2px #999; color: transparent; }
.letra-fantasma { color: #000; opacity: 0.25; }

/* ===== Atividade: ponto a ponto ===== */
.area-ponto-a-ponto { display: flex; justify-content: center; }
.area-ponto-a-ponto svg { width: 100%; max-width: 380px; }

/* ===== Rodapé ===== */
footer.rodape {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  padding: 20px 16px 32px;
  border-top: 1px solid var(--borda);
  max-width: 900px;
  margin: 0 auto;
}
footer.rodape button {
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid var(--borda);
  background: var(--superficie);
  border-radius: 10px;
  color: var(--texto-sec);
  font-size: 13px;
  font-weight: 500;
}
footer.rodape button.perigo { color: #DC2626; border-color: #FCA5A5; }

/* ===== Responsivo ===== */
@media (min-width: 600px) {
  main { padding: 20px; }
  .card { padding: 20px; }
}
@media (min-width: 900px) {
  main { padding: 20px 24px; }
}

/* ===== Impressão ===== */
@page { size: A4 portrait; margin: 12mm; }
@media print {
  body * { visibility: hidden; }
  .folha-a4, .folha-a4 * { visibility: visible; }
  .folha-a4 {
    position: absolute; left: 0; top: 0; width: 100%;
    max-width: none; padding: 0;
    border: none; border-radius: 0; box-shadow: none;
  }
  .no-print { display: none !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<header class="app-header">
  <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="22" fill="#2563EB"/>
    <path d="M50 28 L78 40 L50 52 L22 40 Z" fill="#FFFFFF"/>
    <path d="M32 46 V64 Q50 74 68 64 V46" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="78" cy="40" r="4" fill="#FFFFFF"/>
    <line x1="78" y1="40" x2="78" y2="58" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <div class="header-titulo">
    <span class="fixo">Acompanhamento de</span>
    <input id="nomeCrianca" type="text" placeholder="nome">
  </div>
  <button id="btnTema" type="button" aria-label="Alternar tema"></button>
</header>

<nav class="tabs">
  <button data-tab="1" class="ativa">Checklist</button>
  <button data-tab="2">Atividades</button>
  <button data-tab="3">Brincadeiras</button>
</nav>

<main>
  <section id="painel-1" class="painel-tab ativo">
    <div class="card">
      <h2>Checklist do dia</h2>
      <div class="seletor-data" style="margin-top:12px;">
        <button id="diaAnterior" aria-label="Dia anterior">‹</button>
        <input type="date" id="dataSelecionada">
        <button id="diaSeguinte" aria-label="Dia seguinte">›</button>
      </div>
    </div>

    <div class="card">
      <div id="listaItens"></div>
      <div class="rotulo" style="display:block; margin-top:14px;">Observação do dia</div>
      <textarea id="observacaoDia" placeholder="Algo que valha a pena anotar sobre hoje (opcional)"></textarea>
      <div class="feedback-salvo" id="feedbackSalvo">Salvo</div>
    </div>

    <div class="card-crianca">
      <div class="topo-crianca">
        <div class="mascote" id="mascote"></div>
        <div>
          <div class="mascote-fala" id="mascoteFala"></div>
          <div class="mascote-sub" id="mascoteSub"></div>
        </div>
      </div>
      <div class="jardim">
        <div class="jardim-chao"></div>
        <div class="jardim-plantas" id="jardimPlantas"></div>
        <div class="jardim-vazio" id="jardimVazio">O jardim começa a crescer a cada marcação da semana.</div>
      </div>
      <div id="areaAdesivos"></div>
    </div>

    <div class="card">
      <h2>Semana atual</h2>
      <div class="rotulo" id="intervaloSemana" style="display:block; margin-bottom:12px;"></div>
      <div id="listaSemana"></div>
      <div class="faixa-status" id="faixaStatus"></div>
    </div>

    <div class="card">
      <h2>Últimas semanas</h2>
      <div id="listaHistorico"></div>
    </div>
  </section>

  <section id="painel-2" class="painel-tab">
    <div id="viewGradeAtividades">
      <div class="card">
        <h2>Atividades imprimíveis</h2>
      </div>
      <div class="grid-atividades" id="gridAtividades"></div>
    </div>
    <div id="viewFolhaAtividade" style="display:none;">
      <div class="controles-folha no-print" id="controlesFolha"></div>
      <div class="folha-a4" id="folhaA4">
        <div class="folha-cabecalho" id="folhaCabecalho"></div>
        <div class="folha-corpo" id="folhaCorpo"></div>
        <div class="folha-rodape">Nome: ______________________________________</div>
      </div>
      <div class="acoes-folha no-print">
        <button id="btnImprimir" type="button">Imprimir</button>
        <button id="btnVoltarAtividade" type="button">Voltar</button>
      </div>
    </div>
  </section>

  <section id="painel-3" class="painel-tab">
    <div class="card">
      <h2>Brincadeiras</h2>
      <div class="chips-categoria" id="chipsBrincadeiras" style="margin-top:12px;"></div>
    </div>
    <div class="grid-brincadeiras" id="gridBrincadeiras"></div>
  </section>
</main>

<footer class="rodape">
  <button id="btnExportar">Exportar backup</button>
  <button id="btnImportar">Importar backup</button>
  <input type="file" id="inputImportar" accept="application/json" style="display:none;">
  <button id="btnApagar" class="perigo">Apagar tudo</button>
</footer>

<script>
/* ===== Armazenamento ===== */
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
                catch(e) { return def; } },
  set(k, v)  { try { localStorage.setItem(k, JSON.stringify(v)); return true; }
               catch(e) { return false; } }
};

/* ===== Datas ===== */
const hoje = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function parseISO(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function addDias(dataISO, n) {
  const d = parseISO(dataISO);
  d.setDate(d.getDate() + n);
  return hoje(d);
}
function getSegunda(dataISO) {
  const d = parseISO(dataISO);
  const dia = d.getDay();
  const diff = (dia === 0 ? -6 : 1 - dia);
  d.setDate(d.getDate() + diff);
  return d;
}
function formatarDataCurta(d) {
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}

/* ===== Config ===== */
const config = store.get('acomp.config', { nomeCrianca: '' });
const inputNome = document.getElementById('nomeCrianca');
inputNome.value = config.nomeCrianca || '';
inputNome.addEventListener('input', () => {
  config.nomeCrianca = inputNome.value;
  store.set('acomp.config', config);
  atualizarMascote();
});

/* ===== Tema ===== */
const TEMAS = ['auto', 'claro', 'escuro'];
const ICONES_TEMA = {
  auto: '<circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>',
  claro: '<circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>',
  escuro: '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="currentColor" stroke="none"/>'
};
const ROTULOS_TEMA = { auto: 'Tema automático', claro: 'Tema claro', escuro: 'Tema escuro' };
const btnTema = document.getElementById('btnTema');
const metaThemeColor = document.querySelector('meta[name="theme-color"]');

function temaEscuroAtivo(tema) {
  if (tema === 'escuro') return true;
  if (tema === 'claro') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function aplicarTema() {
  const tema = TEMAS.includes(config.tema) ? config.tema : 'auto';
  if (tema === 'auto') document.documentElement.removeAttribute('data-tema');
  else document.documentElement.setAttribute('data-tema', tema);
  btnTema.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${ICONES_TEMA[tema]}</svg>`;
  btnTema.setAttribute('aria-label', ROTULOS_TEMA[tema]);
  btnTema.setAttribute('title', ROTULOS_TEMA[tema]);
  if (metaThemeColor) metaThemeColor.setAttribute('content', temaEscuroAtivo(tema) ? '#0F172A' : '#2563EB');
}

btnTema.addEventListener('click', () => {
  const atual = TEMAS.indexOf(TEMAS.includes(config.tema) ? config.tema : 'auto');
  config.tema = TEMAS[(atual + 1) % TEMAS.length];
  store.set('acomp.config', config);
  aplicarTema();
});

if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!TEMAS.includes(config.tema) || config.tema === 'auto') aplicarTema();
  });
}
aplicarTema();

/* ===== Navegação de abas ===== */
const botoesTab = document.querySelectorAll('nav.tabs button');
const paineisTab = document.querySelectorAll('.painel-tab');
botoesTab.forEach(btn => {
  btn.setAttribute('role', 'tab');
  btn.setAttribute('aria-selected', btn.classList.contains('ativa') ? 'true' : 'false');
  btn.addEventListener('click', () => {
    botoesTab.forEach(b => { b.classList.remove('ativa'); b.setAttribute('aria-selected', 'false'); });
    paineisTab.forEach(p => p.classList.remove('ativo'));
    btn.classList.add('ativa');
    btn.setAttribute('aria-selected', 'true');
    document.getElementById('painel-' + btn.dataset.tab).classList.add('ativo');
  });
});
document.querySelector('nav.tabs').setAttribute('role', 'tablist');

/* ===== Checklist: itens ===== */
const ITENS_CHECKLIST = [
  { id: 'concentracao', label: 'Concentração', desc: 'Ficou 15-20 min numa atividade só' },
  { id: 'instrucoes', label: 'Seguir instruções', desc: 'Cumpriu uma sequência de 2-3 passos' },
  { id: 'frustracao', label: 'Frustração', desc: 'Algo deu errado e ele tentou de novo' },
  { id: 'interacao', label: 'Interação social', desc: 'Brincou bem com outras crianças' },
  { id: 'qualidade', label: 'Tempo de qualidade', desc: 'Tivemos tempo focado juntos' }
];

let checklistDados = store.get('acomp.checklist', {});
const inputData = document.getElementById('dataSelecionada');
const listaItens = document.getElementById('listaItens');
const observacaoDia = document.getElementById('observacaoDia');
const feedbackSalvo = document.getElementById('feedbackSalvo');
let timeoutFeedback = null;

function registroDoDia(dataISO) {
  if (!checklistDados[dataISO]) {
    checklistDados[dataISO] = { itens: [false, false, false, false, false], nota: '' };
  }
  return checklistDados[dataISO];
}

function renderizarItens(dataISO) {
  const reg = registroDoDia(dataISO);
  listaItens.innerHTML = '';
  ITENS_CHECKLIST.forEach((item, i) => {
    const label = document.createElement('label');
    label.className = 'item-check';
    label.innerHTML = `
      <input type="checkbox" data-indice="${i}" ${reg.itens[i] ? 'checked' : ''}>
      <span class="texto-item">
        <strong>${item.label}</strong>
        <small>${item.desc}</small>
      </span>
    `;
    listaItens.appendChild(label);
  });
  observacaoDia.value = reg.nota || '';
}

function mostrarFeedbackSalvo() {
  feedbackSalvo.classList.add('mostrar');
  clearTimeout(timeoutFeedback);
  timeoutFeedback = setTimeout(() => feedbackSalvo.classList.remove('mostrar'), 2000);
}

function salvarChecklist() {
  store.set('acomp.checklist', checklistDados);
  mostrarFeedbackSalvo();
}

listaItens.addEventListener('change', (e) => {
  if (e.target.matches('input[type="checkbox"]')) {
    const dataISO = inputData.value;
    const reg = registroDoDia(dataISO);
    const eraSemanaBoa = statusSemana(contarSemana(getSegunda(dataISO))) === 'boa';
    reg.itens[Number(e.target.dataset.indice)] = e.target.checked;
    salvarChecklist();
    renderizarSemana();
    if (e.target.checked) reagirAoProgresso(reg, eraSemanaBoa, dataISO);
  }
});

let timeoutNota = null;
observacaoDia.addEventListener('input', () => {
  const dataISO = inputData.value;
  registroDoDia(dataISO).nota = observacaoDia.value;
  clearTimeout(timeoutNota);
  timeoutNota = setTimeout(salvarChecklist, 500);
});

/* ===== Painel semanal ===== */
const listaSemana = document.getElementById('listaSemana');
const intervaloSemana = document.getElementById('intervaloSemana');
const faixaStatus = document.getElementById('faixaStatus');
const listaHistorico = document.getElementById('listaHistorico');

function contarSemana(segunda) {
  const contagens = [0, 0, 0, 0, 0];
  for (let i = 0; i < 7; i++) {
    const d = new Date(segunda);
    d.setDate(d.getDate() + i);
    const iso = hoje(d);
    const reg = checklistDados[iso];
    if (reg) {
      reg.itens.forEach((marcado, idx) => { if (marcado) contagens[idx]++; });
    }
  }
  return contagens;
}

function statusSemana(contagens) {
  const itensBons = contagens.filter(c => c >= 3).length;
  return itensBons >= 3 ? 'boa' : 'andamento';
}

function renderizarSemana() {
  const dataISO = inputData.value;
  const segunda = getSegunda(dataISO);
  const domingo = new Date(segunda);
  domingo.setDate(domingo.getDate() + 6);
  intervaloSemana.textContent = `${formatarDataCurta(segunda)} a ${formatarDataCurta(domingo)}`;

  const contagens = contarSemana(segunda);
  listaSemana.innerHTML = '';
  ITENS_CHECKLIST.forEach((item, i) => {
    const pct = Math.round((contagens[i] / 7) * 100);
    const linha = document.createElement('div');
    linha.className = 'linha-item-semana';
    linha.innerHTML = `
      <div class="topo-linha"><span>${item.label}</span><span>${contagens[i]}/7</span></div>
      <div class="barra-fundo"><div class="barra-progresso" style="width:${pct}%"></div></div>
    `;
    listaSemana.appendChild(linha);
  });

  const status = statusSemana(contagens);
  faixaStatus.className = 'faixa-status ' + status;
  faixaStatus.textContent = status === 'boa' ? 'Semana boa' : 'Semana em andamento';

  renderizarHistorico(segunda);
  renderizarPainelCrianca(contagens);
}

/* ===== Painel da criança ===== */
const MASCOTE_ROSTOS = {
  neutro: '<path d="M38 44 Q42 40 46 44" /><path d="M54 44 Q58 40 62 44" /><path d="M42 58 Q50 63 58 58" />',
  feliz:  '<path d="M36 42 Q41 36 46 42" /><path d="M54 42 Q59 36 64 42" /><path d="M38 55 Q50 68 62 55" />',
  festa:  '<path d="M36 44 L46 44" /><path d="M54 44 L64 44" /><path d="M36 54 Q50 70 64 54 Z" />'
};
function svgMascote(humor) {
  return `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="56" rx="34" ry="32" style="fill:#FBBF24"/>
    <path d="M22 34 L18 12 L38 24 Z" style="fill:#FBBF24"/>
    <path d="M78 34 L82 12 L62 24 Z" style="fill:#FBBF24"/>
    <circle cx="50" cy="56" r="24" style="fill:#FFF7E0"/>
    <g stroke="#1F2937" stroke-width="3" stroke-linecap="round" fill="none">${MASCOTE_ROSTOS[humor]}</g>
  </svg>`;
}
function svgBroto(tipo) {
  const cores = ['#EC4899', '#F97316', '#FBBF24', '#60A5FA'];
  const cor = cores[tipo % cores.length];
  return `<svg viewBox="0 0 20 26" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 26 V13" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M10 20 C6 20 4 17 3 15 C7 14 9 16 10 18Z" style="fill:#16A34A"/>
    <circle cx="10" cy="8" r="5.5" style="fill:${cor}"/>
    <circle cx="10" cy="8" r="2" style="fill:#FFF7E0"/>
  </svg>`;
}
function svgEstrela(cor) {
  return `<svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7 .8-5.2 4.8 1.4 7L12 17.7 5.8 21.2l1.4-7L2 9.4l7-.8Z" style="fill:${cor}"/></svg>`;
}

const elMascote = document.getElementById('mascote');
const elMascoteFala = document.getElementById('mascoteFala');
const elMascoteSub = document.getElementById('mascoteSub');
const elJardim = document.getElementById('jardimPlantas');
const elJardimVazio = document.getElementById('jardimVazio');
const elAdesivos = document.getElementById('areaAdesivos');

function primeiroNome() {
  const nome = (config.nomeCrianca || '').trim();
  return nome ? nome.split(' ')[0] : 'seu pequeno';
}

function atualizarMascote() {
  const reg = checklistDados[inputData.value];
  const marcados = reg ? reg.itens.filter(Boolean).length : 0;
  const humor = marcados === 5 ? 'festa' : marcados >= 3 ? 'feliz' : 'neutro';
  elMascote.innerHTML = svgMascote(humor);
  if (marcados === 0) {
    elMascoteFala.textContent = `Vamos começar o dia!`;
    elMascoteSub.textContent = `Marque o que ${primeiroNome()} fez hoje.`;
  } else if (marcados === 5) {
    elMascoteFala.textContent = 'Dia completo!';
    elMascoteSub.textContent = 'Todos os 5 pontos de hoje foram marcados.';
  } else {
    elMascoteFala.textContent = `${marcados} de 5 hoje`;
    elMascoteSub.textContent = 'Cada marcação faz o jardim crescer.';
  }
}

function renderizarPainelCrianca(contagens) {
  atualizarMascote();

  const total = contagens.reduce((a, b) => a + b, 0);
  elJardim.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const div = document.createElement('div');
    div.innerHTML = svgBroto(i);
    const svg = div.firstElementChild;
    svg.style.animationDelay = `${Math.min(i * 35, 700)}ms`;
    elJardim.appendChild(svg);
  }
  elJardimVazio.style.display = total === 0 ? 'block' : 'none';

  const conquistas = contarSemanasBoas();
  if (conquistas === 0) {
    elAdesivos.innerHTML = '<div class="adesivos-vazio">Complete uma semana boa para ganhar o primeiro adesivo.</div>';
  } else {
    const selos = Array.from({ length: Math.min(conquistas, 12) },
      () => `<div class="adesivo">${svgEstrela('#FBBF24')}</div>`).join('');
    elAdesivos.innerHTML = `<div class="rotulo">Adesivos conquistados: ${conquistas}</div><div class="adesivos">${selos}</div>`;
  }
}

function contarSemanasBoas() {
  const datas = Object.keys(checklistDados);
  if (!datas.length) return 0;
  const segundas = new Set();
  datas.forEach(iso => segundas.add(hoje(getSegunda(iso))));
  let total = 0;
  segundas.forEach(iso => { if (statusSemana(contarSemana(parseISO(iso))) === 'boa') total++; });
  return total;
}

/* ===== Celebração ===== */
function celebrar(texto) {
  const camada = document.createElement('div');
  camada.className = 'celebracao';
  camada.innerHTML = `<div class="celebracao-texto">${texto}</div>`;
  const cores = ['#FBBF24', '#F97316', '#EC4899', '#16A34A', '#2563EB'];
  for (let i = 0; i < 14; i++) {
    const faisca = document.createElement('div');
    faisca.className = 'faisca';
    faisca.innerHTML = svgEstrela(cores[i % cores.length]);
    faisca.style.left = `${10 + Math.random() * 80}%`;
    faisca.style.top = `${45 + Math.random() * 20}%`;
    faisca.style.animationDelay = `${Math.random() * 400}ms`;
    camada.appendChild(faisca);
  }
  document.body.appendChild(camada);
  setTimeout(() => camada.remove(), 2200);
}

function reagirAoProgresso(reg, eraSemanaBoa, dataISO) {
  const virouSemanaBoa = !eraSemanaBoa && statusSemana(contarSemana(getSegunda(dataISO))) === 'boa';
  if (virouSemanaBoa) celebrar('Semana boa!');
  else if (reg.itens.every(Boolean)) celebrar('Dia completo!');
}

function renderizarHistorico(segundaAtual) {
  listaHistorico.innerHTML = '';
  for (let s = 0; s < 4; s++) {
    const segunda = new Date(segundaAtual);
    segunda.setDate(segunda.getDate() - (7 * s));
    const domingo = new Date(segunda);
    domingo.setDate(domingo.getDate() + 6);
    const contagens = contarSemana(segunda);
    const total = contagens.reduce((a, b) => a + b, 0);
    const status = statusSemana(contagens);

    const linha = document.createElement('div');
    linha.className = 'linha-historico';
    linha.innerHTML = `
      <span class="intervalo">${formatarDataCurta(segunda)} - ${formatarDataCurta(domingo)}</span>
      <span class="total">${total} marcações</span>
      <span class="tag-status ${status}">${status === 'boa' ? 'Semana boa' : 'Em andamento'}</span>
    `;
    listaHistorico.appendChild(linha);
  }
}

/* ===== Seletor de data ===== */
function carregarData(dataISO) {
  inputData.value = dataISO;
  renderizarItens(dataISO);
  renderizarSemana();
}

inputData.addEventListener('change', () => carregarData(inputData.value));
document.getElementById('diaAnterior').addEventListener('click', () => carregarData(addDias(inputData.value, -1)));
document.getElementById('diaSeguinte').addEventListener('click', () => carregarData(addDias(inputData.value, 1)));

carregarData(hoje(new Date()));

/* ===== Backup: exportar / importar / apagar ===== */
document.getElementById('btnExportar').addEventListener('click', () => {
  const dados = {
    'acomp.checklist': store.get('acomp.checklist', {}),
    'acomp.favAtividades': store.get('acomp.favAtividades', []),
    'acomp.favBrincadeiras': store.get('acomp.favBrincadeiras', []),
    'acomp.config': store.get('acomp.config', {})
  };
  const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `acompanhamento-${hoje(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

const inputImportar = document.getElementById('inputImportar');
document.getElementById('btnImportar').addEventListener('click', () => inputImportar.click());
inputImportar.addEventListener('change', () => {
  const arquivo = inputImportar.files[0];
  if (!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try {
      const dados = JSON.parse(leitor.result);
      const chavesValidas = ['acomp.checklist', 'acomp.favAtividades', 'acomp.favBrincadeiras', 'acomp.config'];
      const temChaveValida = chavesValidas.some(k => k in dados);
      if (!temChaveValida) { alert('Arquivo inválido: nenhuma chave reconhecida.'); return; }
      if (!confirm('Importar este backup vai substituir todos os dados atuais. Continuar?')) return;
      chavesValidas.forEach(k => { if (k in dados) store.set(k, dados[k]); });
      alert('Backup importado com sucesso. A página será recarregada.');
      location.reload();
    } catch (e) {
      alert('Não foi possível ler o arquivo. Verifique se é um backup válido.');
    }
  };
  leitor.readAsText(arquivo);
  inputImportar.value = '';
});

document.getElementById('btnApagar').addEventListener('click', () => {
  if (!confirm('Isso vai apagar todos os dados salvos (checklist, favoritos e configurações). Tem certeza?')) return;
  ['acomp.checklist', 'acomp.favAtividades', 'acomp.favBrincadeiras', 'acomp.config'].forEach(k => {
    try { localStorage.removeItem(k); } catch(e) {}
  });
  location.reload();
});

function iconeCoracao(preenchido, cor) {
  return `<svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 21s-7.5-4.6-10-9.3C0.5 8.5 2 4 6 4c2 0 3.5 1.2 4 2.5C10.5 5.2 12 4 14 4c4 0 5.5 4.5 4 7.7C19.5 16.4 12 21 12 21Z" fill="${preenchido ? cor : 'none'}" stroke="${preenchido ? cor : '#9CA3AF'}" stroke-width="2"/></svg>`;
}

function brincadeirasFiltradas() {
  if (filtroBrincadeira === 'todas') return BRINCADEIRAS;
  if (filtroBrincadeira === 'favoritas') return BRINCADEIRAS.filter(b => favBrincadeiras.includes(b.id));
  return BRINCADEIRAS.filter(b => b.categoria === filtroBrincadeira);
}

function renderizarChipsBrincadeiras() {
  const chips = document.getElementById('chipsBrincadeiras');
  const opcoes = [
    { id: 'todas', nome: 'Todas', cor: '#EC4899' },
    ...Object.entries(CATEGORIAS_BRINCADEIRA).map(([id, c]) => ({ id, nome: c.nome, cor: c.cor })),
    { id: 'favoritas', nome: 'Favoritas', cor: '#EC4899' }
  ];
  chips.innerHTML = '';
  opcoes.forEach(op => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (filtroBrincadeira === op.id ? ' ativo' : '');
    btn.textContent = op.nome;
    if (filtroBrincadeira === op.id) {
      btn.style.background = op.cor;
      btn.style.borderColor = op.cor;
    }
    btn.addEventListener('click', () => {
      filtroBrincadeira = op.id;
      renderizarChipsBrincadeiras();
      renderizarGridBrincadeiras();
    });
    chips.appendChild(btn);
  });
}

function renderizarGridBrincadeiras() {
  const grid = document.getElementById('gridBrincadeiras');
  grid.innerHTML = '';
  const lista = brincadeirasFiltradas();
  if (!lista.length) {
    grid.innerHTML = `<div class="estado-vazio">
      ${svgMascote('neutro')}
      <strong>Nenhuma favorita ainda</strong>
      <span>Toque no coração de uma brincadeira para guardá-la aqui.</span>
    </div>`;
    return;
  }
  lista.forEach(b => {
    const cor = CATEGORIAS_BRINCADEIRA[b.categoria].cor;
    const favorita = favBrincadeiras.includes(b.id);
    const card = document.createElement('div');
    card.className = 'card-brincadeira';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `${b.nome} — ${b.duracao}`);
    card.innerHTML = `
      <div class="tarja" style="background:${cor}"></div>
      <button class="btn-favorito" aria-pressed="${favorita}" aria-label="${favorita ? 'Remover dos favoritos' : 'Adicionar aos favoritos'}" type="button">${iconeCoracao(favorita, cor)}</button>
      <div class="conteudo">
        <div class="cabecalho">
          ${iconeCategoria(b.categoria)}
          <div>
            <h3>${b.nome}</h3>
            <div class="duracao">${b.duracao}</div>
          </div>
        </div>
        <p style="margin-top:8px;color:var(--texto-sec);font-size:14px;">${b.descricao}</p>
        <div class="detalhe-brincadeira">
          <h4>Materiais</h4>
          <p style="margin-bottom:10px;">${b.materiais.join(', ')}</p>
          <h4>Como fazer</h4>
          <ol>${b.comoFazer.map(p => `<li>${p}</li>`).join('')}</ol>
        </div>
      </div>
    `;
    card.addEventListener('click', (e) => {
      if (e.target.closest('.btn-favorito')) return;
      card.querySelector('.detalhe-brincadeira').classList.toggle('aberto');
    });
    card.addEventListener('keydown', (e) => {
      if (e.target !== card || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      card.querySelector('.detalhe-brincadeira').classList.toggle('aberto');
    });
    card.querySelector('.btn-favorito').addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = favBrincadeiras.indexOf(b.id);
      if (idx >= 0) favBrincadeiras.splice(idx, 1); else favBrincadeiras.push(b.id);
      store.set('acomp.favBrincadeiras', favBrincadeiras);
      renderizarGridBrincadeiras();
    });
    grid.appendChild(card);
  });
}

renderizarChipsBrincadeiras();
renderizarGridBrincadeiras();

function renderFigura(id, modo) {
  const fig = FIGURAS_BASE[id];
  let html = [fig.contorno, ...fig.extras].map(s => shapeSVG(s, modo)).join('');
  if (modo !== 'silhueta') html += fig.detalhes.map(shapeDetalhe).join('');
  return html;
}
function svgFigura(id, modo) {
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${renderFigura(id, modo)}</svg>`;

let favAtividades = store.get('acomp.favAtividades', []);

function renderizarGridAtividades() {
  const grid = document.getElementById('gridAtividades');
  grid.innerHTML = '';
  ATIVIDADES.forEach(a => {
    const favorita = favAtividades.includes(a.id);
    const card = document.createElement('div');
    card.className = 'card-atividade';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `${a.nome} — ${a.dificuldade}`);
    card.innerHTML = `
      <button class="btn-favorito" aria-pressed="${favorita}" aria-label="${favorita ? 'Remover dos favoritos' : 'Adicionar aos favoritos'}" type="button">${iconeCoracao(favorita, '#16A34A')}</button>
      <div class="cabecalho">
        ${iconeAtividade(a.id)}
        <div>
          <h3>${a.nome}</h3>
          <div class="dificuldade">${a.dificuldade}</div>
        </div>
      </div>
    `;
    card.addEventListener('click', (e) => {
      if (e.target.closest('.btn-favorito')) return;
      abrirAtividade(a.id);
    });
    card.addEventListener('keydown', (e) => {
      if (e.target !== card || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      abrirAtividade(a.id);
    });
    card.querySelector('.btn-favorito').addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = favAtividades.indexOf(a.id);
      if (idx >= 0) favAtividades.splice(idx, 1); else favAtividades.push(a.id);
      store.set('acomp.favAtividades', favAtividades);
      renderizarGridAtividades();
    });
    grid.appendChild(card);
  });
}

/* ===== Atividade: labirinto ===== */
function gerarLabirinto(n) {
  const grade = [];
  for (let y = 0; y < n; y++) {
    grade.push([]);
    for (let x = 0; x < n; x++) grade[y].push({ n: true, s: true, l: true, o: true, visitado: false });
  }
  const pilha = [[0, 0]];
  grade[0][0].visitado = true;
  const opostos = { n: 's', s: 'n', l: 'o', o: 'l' };
  while (pilha.length) {
    const [x, y] = pilha[pilha.length - 1];
    const vizinhos = [];
    if (y > 0 && !grade[y - 1][x].visitado) vizinhos.push(['n', x, y - 1]);
    if (y < n - 1 && !grade[y + 1][x].visitado) vizinhos.push(['s', x, y + 1]);
    if (x > 0 && !grade[y][x - 1].visitado) vizinhos.push(['o', x - 1, y]);
    if (x < n - 1 && !grade[y][x + 1].visitado) vizinhos.push(['l', x + 1, y]);
    if (vizinhos.length === 0) { pilha.pop(); continue; }
    const [dir, nx, ny] = vizinhos[Math.floor(Math.random() * vizinhos.length)];
    grade[y][x][dir] = false;
    grade[ny][nx][opostos[dir]] = false;
    grade[ny][nx].visitado = true;
    pilha.push([nx, ny]);
  }
  return grade;
}
function svgLabirinto(grade, n) {
  const tam = n * 30;
  let linhas = '';
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const c = grade[y][x];
      const x0 = x * 30, y0 = y * 30, x1 = x0 + 30, y1 = y0 + 30;
      if (c.n && !(x === 0 && y === 0)) linhas += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}"/>`;
      if (c.s && !(x === n - 1 && y === n - 1)) linhas += `<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}"/>`;
      if (c.o) linhas += `<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}"/>`;
      if (c.l) linhas += `<line x1="${x1}" y1="${y0}" x2="${x1}" y2="${y1}"/>`;
    }
  }
  return `<svg viewBox="-16 -14 ${tam + 32} ${tam + 40}" stroke="#000" stroke-width="2" stroke-linecap="square">
    <text x="-14" y="-4" font-size="9">Entrada</text>
    <text x="${tam - 24}" y="${tam + 24}" font-size="9">Saída</text>
    ${linhas}
  </svg>`;
}
function montarLabirinto() {
  let dificuldade = 'facil';

/* ===== Atividade: ponto a ponto ===== */
function gerarPontosEstrela(cx, cy, pontas, rOut, rIn) {
  const pontos = [];
  const passo = Math.PI / pontas;
  for (let i = 0; i < pontas * 2; i++) {
    const r = i % 2 === 0 ? rOut : rIn;
    const ang = -Math.PI / 2 + i * passo;
    pontos.push([+(cx + r * Math.cos(ang)).toFixed(1), +(cy + r * Math.sin(ang)).toFixed(1)]);
  }
  return pontos;
}
